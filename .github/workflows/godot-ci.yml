name: Godot 3D Engine CI & Multiplatform Export

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-headless-tests:
    name: Godot 4.3 Headless Scene Validation & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: docker.io/barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Godot Version
        run: godot --version

      - name: Restore Godot Import Cache
        uses: actions/cache@v4
        with:
          path: godot/.godot/imported
          key: godot-imported-${{ runner.os }}-${{ hashFiles('godot/project.godot', 'godot/export_presets.cfg') }}
          restore-keys: |
            godot-imported-${{ runner.os }}-
            godot-imported-

      - name: Import Godot Assets & Generate Project Cache
        run: |
          timeout 180s godot --headless --path ./godot --import || echo "Asset import phase settled"

      - name: Execute Godot Headless Test Runner
        run: godot --headless --path ./godot -s res://tests/runner.gd

  godot-multiplatform-export:
    name: Export Build (${{ matrix.platform }})
    needs: [godot-headless-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: docker.io/barichello/godot-ci:4.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux/X11
            output_dir: builds/linux
            output_file: mythos_3d.x86_64
            artifact_name: mythos-3d-linux-x64
          - platform: Windows Desktop
            output_dir: builds/windows
            output_file: mythos_3d.exe
            artifact_name: mythos-3d-windows-x64
          - platform: Web
            output_dir: builds/web
            output_file: index.html
            artifact_name: mythos-3d-web-pwa
          - platform: macOS
            output_dir: builds/macos
            output_file: mythos_3d.zip
            artifact_name: mythos-3d-macos
          - platform: Android
            output_dir: builds/android
            output_file: mythos_3d.apk
            artifact_name: mythos-3d-android-apk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Godot Import Cache
        uses: actions/cache@v4
        with:
          path: godot/.godot/imported
          key: godot-imported-${{ runner.os }}-${{ hashFiles('godot/project.godot', 'godot/export_presets.cfg') }}
          restore-keys: |
            godot-imported-${{ runner.os }}-
            godot-imported-

      - name: Export ${{ matrix.platform }}
        run: |
          mkdir -p /tmp/export ${{ matrix.output_dir }}
          godot --headless --path ./godot --export-release "${{ matrix.platform }}" "/tmp/export/${{ matrix.output_file }}"
          cp -r /tmp/export/* "${{ matrix.output_dir }}/"

      - name: Upload Export Artifact (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_dir }}/
          retention-days: 14
