name: Godot 3D Engine CI & Multiplatform Export

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-headless-tests:
    name: Godot 4.3 Headless Scene Validation & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: docker.io/barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Godot Version
        run: godot --version

      - name: Restore Godot Import Cache
        uses: actions/cache@v4
        with:
          path: godot/.godot/imported
          key: godot-imported-${{ runner.os }}-${{ hashFiles('godot/project.godot', 'godot/export_presets.cfg') }}
          restore-keys: |
            godot-imported-${{ runner.os }}-
            godot-imported-

      - name: Import Godot Assets & Generate Project Cache
        run: |
          timeout 180s godot --headless --path ./godot --import || echo "Asset import phase settled"

      - name: Execute Godot Headless Test Runner
        run: godot --headless --path ./godot -s res://tests/runner.gd

  godot-multiplatform-export:
    name: Export Build (${{ matrix.platform }})
    needs: [godot-headless-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: docker.io/barichello/godot-ci:4.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux/X11
            output_dir: builds/linux
            output_file: mythos_3d.x86_64
            artifact_name: mythos-3d-linux-x64
            export_type: --export-release
          - platform: Windows Desktop
            output_dir: builds/windows
            output_file: mythos_3d.exe
            artifact_name: mythos-3d-windows-x64
            export_type: --export-release
          - platform: Web
            output_dir: builds/web
            output_file: index.html
            artifact_name: mythos-3d-web-pwa
            export_type: --export-release
          - platform: macOS
            output_dir: builds/macos
            output_file: mythos_3d.zip
            artifact_name: mythos-3d-macos
            export_type: --export-release
          - platform: Android
            output_dir: builds/android
            output_file: mythos_3d.apk
            artifact_name: mythos-3d-android-apk
            export_type: --export-debug
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot Export Templates & Config
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mkdir -v -p ~/.local/share/godot/templates
          mkdir -v -p ~/.config ~/.android /tmp/export
          if [ -d /root/.local/share/godot/export_templates ]; then
            cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          fi
          if [ -d /root/.local/share/godot/templates ]; then
            cp -r /root/.local/share/godot/templates/* ~/.local/share/godot/templates/ 2>/dev/null || true
          fi
          if [ -d /root/.config/godot ]; then
            cp -r /root/.config/godot ~/.config/ 2>/dev/null || true
          fi
          if [ -f /root/debug.keystore ]; then
            cp /root/debug.keystore /tmp/debug.keystore 2>/dev/null || true
            cp /root/debug.keystore ~/.android/debug.keystore 2>/dev/null || true
            chmod 666 /tmp/debug.keystore ~/.android/debug.keystore 2>/dev/null || true
          fi
          if [ -d /root/.android ]; then
            cp -r /root/.android/* ~/.android/ 2>/dev/null || true
          fi
          if [ -f ~/.config/godot/editor_settings-4.3.tres ]; then
            sed -i 's|/root/debug.keystore|/tmp/debug.keystore|g' ~/.config/godot/editor_settings-4.3.tres
          fi
          if [ -f ~/.config/godot/editor_settings-4.tres ]; then
            sed -i 's|/root/debug.keystore|/tmp/debug.keystore|g' ~/.config/godot/editor_settings-4.tres
          fi
          if [ -d /usr/lib/android-sdk/platforms/android-33 ] && [ ! -d /usr/lib/android-sdk/platforms/android-34 ]; then
            ln -s /usr/lib/android-sdk/platforms/android-33 /usr/lib/android-sdk/platforms/android-34 2>/dev/null || true
          fi
          if [ -d /usr/lib/android-sdk/build-tools/33.0.2 ] && [ ! -d /usr/lib/android-sdk/build-tools/34.0.0 ]; then
            ln -s /usr/lib/android-sdk/build-tools/33.0.2 /usr/lib/android-sdk/build-tools/34.0.0 2>/dev/null || true
          fi
          echo "Installed Godot Export Templates:"
          ls -la ~/.local/share/godot/export_templates/ || true

      - name: Restore Godot Import Cache
        uses: actions/cache@v4
        with:
          path: godot/.godot/imported
          key: godot-imported-${{ runner.os }}-${{ hashFiles('godot/project.godot', 'godot/export_presets.cfg') }}
          restore-keys: |
            godot-imported-${{ runner.os }}-
            godot-imported-

      - name: Export ${{ matrix.platform }}
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p /tmp/export ${{ matrix.output_dir }}
          rm -rf /tmp/export/*
          godot --headless --path ./godot ${{ matrix.export_type }} "${{ matrix.platform }}" "/tmp/export/${{ matrix.output_file }}"
          cp -r /tmp/export/* "${{ matrix.output_dir }}/"

      - name: Upload Export Artifact (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_dir }}/
          retention-days: 14
