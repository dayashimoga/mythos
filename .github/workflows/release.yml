name: Release - Multi-Platform Distribution Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-platform-artifacts:
    name: Build Multi-Platform Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java for Android tooling
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        run: |
          npm run lint
          npm run verify:append-only
          npm run test:coverage

      - name: Build web bundle & assets
        run: npm run build

      - name: Generate CycloneDX SBOM and Dependency Manifest
        run: npm run generate:sbom

      - name: Package all target platforms (Web, Windows, Linux, macOS, Android, iOS)
        run: npm run build:platforms

      - name: Verify SHA256 checksums file
        run: |
          cat dist/release-artifacts/SHA256SUMS.txt
          test -f dist/release-artifacts/SHA256SUMS.txt || exit 1

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-platform-release-artifacts
          path: dist/release-artifacts/
          retention-days: 30

  macos-ios-verification:
    name: Apple Build Target Verification (macOS / Xcode)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify macOS build environment and test suite
        run: npm run test

      - name: Compile and verify Apple bundle packaging
        run: |
          npm run build
          npm run build:platforms

  publish-github-release:
    name: Publish GitHub Release with Authenticated SHA-256 Hashes
    needs: [build-platform-artifacts, macos-ios-verification]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          name: all-platform-release-artifacts
          path: dist/release-artifacts/

      - name: Prepare Release Notes
        id: notes
        run: |
          TAG_NAME="${{ github.ref_name || github.event.inputs.release_tag }}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Mythos: Astra & The Seven Realms - ${{ steps.notes.outputs.tag_name }}"
          tag_name: ${{ steps.notes.outputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            dist/release-artifacts/*
            dist/SBOM.json
            dist/DEPENDENCY_MANIFEST.json
            dist/BUILD_REPORT.json
          body: |
            ## Mythos: Astra & The Seven Realms — Official Multi-Platform Release

            ### Distribution Artifacts & Cryptographic Checksums
            All distribution artifacts are accompanied by authenticated SHA-256 hashes generated during the reproducible CI build process.

            ### Platform Status:
            - **Web:** Production Ready PWA bundle (`.zip`)
            - **Windows:** Standalone x64 bundle (`.zip`)
            - **Linux:** Standalone x64 bundle (`.tar.gz`)
            - **macOS:** Universal Application bundle (Unsigned Development Build - requires Gatekeeper approval)
            - **Android:** Installable APK (`.apk`)
            - **iOS:** Xcode Archive (Unsigned Development Build - requires provisioning profile)

            ### Integrity & Security:
            - CycloneDX SBOM: Included in release assets
            - Dependency Manifest: Included in release assets
            - Test Coverage: $\ge 90\%$ passing first-party engine code
